<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&amp;display=swap');
    
    .title {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 56px;
      fill: #ffffff;
      letter-spacing: -0.02em;
    }
    
    .subtitle {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #A5B4FC;
      letter-spacing: -0.01em;
      opacity: 0.9;
    }
    
    .badge {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e0e7ff;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .pulse-slow {
      animation: pulse 8s ease-in-out infinite;
    }
    
    .float-slow {
      animation: float 6s ease-in-out infinite;
    }

    .glow-logo {
      filter: url(#glow);
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.05); }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>

  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090816"/>
      <stop offset="50%" stop-color="#0F0D27"/>
      <stop offset="100%" stop-color="#05050B"/>
    </linearGradient>

    <!-- Radial glow in the center -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo Line Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Card Glassmorphism Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    
    <!-- Card Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Radial Glow (Ambient) -->
  <circle cx="600" cy="200" r="450" fill="url(#centerGlow)" class="pulse-slow" style="transform-origin: 600px 200px;"/>

  <!-- Decorative Tech Grid (Subtle dot pattern) -->
  <g opacity="0.15">
    <pattern id="dotPattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#818CF8" />
    </pattern>
    <rect width="1200" height="400" fill="url(#dotPattern)"/>
  </g>

  <!-- Abstract glowing orb backgrounds -->
  <circle cx="250" cy="120" r="100" fill="#4F46E5" opacity="0.08" filter="url(#glow)"/>
  <circle cx="950" cy="280" r="120" fill="#6366F1" opacity="0.06" filter="url(#glow)"/>

  <!-- Glassmorphic central container -->
  <g class="float-slow">
    <!-- Outer glass card boundary -->
    <rect x="250" y="40" width="700" height="320" rx="24" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.5"/>

    <!-- Glowing Waveform Logo -->
    <g transform="translate(550, 65)">
      <!-- Logo background glow ring -->
      <circle cx="50" cy="50" r="45" fill="#6366F1" opacity="0.1" filter="url(#glow)"/>
      <circle cx="50" cy="50" r="40" stroke="url(#cardBorder)" stroke-width="1" fill="none"/>
      
      <!-- Waveform path itself -->
      <svg width="100" height="100" viewBox="0 0 100 100">
        <path d="M 25 43 C 27 43, 29 33, 34 33 C 39 33, 37 57, 40 57 C 43 57, 40 70, 43 70 C 46 70, 48 25, 55 25 C 62 25, 73 25, 74 27 C 76 29, 73 35, 71 41 C 69 47, 67 49, 64 49 C 61 49, 58 38, 55 38 C 52 38, 52 45, 54 49 C 56 53, 59 53, 61 53 C 63 53, 65 47, 67 43" 
              fill="none" 
              stroke="url(#logoGrad)" 
              stroke-width="6" 
              stroke-linecap="round" 
              stroke-linejoin="round"
              class="glow-logo"/>
      </svg>
    </g>

    <!-- Typography -->
    <!-- Title -->
    <text x="600" y="225" text-anchor="middle" class="title">SpeakFlow</text>

    <!-- Subtitle -->
    <text x="600" y="265" text-anchor="middle" class="subtitle">AI-Powered Teleprompter for Confident Public Speaking</text>

    <!-- Tech Pills -->
    <g transform="translate(380, 295)">
      <!-- Pill 1: AI Generated -->
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1"/>
      <text x="65" y="17" text-anchor="middle" class="badge">AI Scripts</text>

      <!-- Pill 2: Practice Studio -->
      <rect x="145" y="0" width="150" height="26" rx="13" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1"/>
      <text x="220" y="17" text-anchor="middle" class="badge">Practice Studio</text>

      <!-- Pill 3: Distraction Free -->
      <rect x="310" y="0" width="130" height="26" rx="13" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.3" stroke-width="1"/>
      <text x="375" y="17" text-anchor="middle" class="badge">Focus Mode</text>
    </g>
  </g>
</svg>
